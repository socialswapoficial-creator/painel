<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg"><link rel="stylesheet" href="admin.css"><title>Painel | Moda Infantil</title>
</head>
<body>
<header><a class="brand" id="storefront-link" href="https://vitrine-moda-infantil-nux.vendasalcapone435.chatgpt.site/"><img src="logo.svg" alt="" width="36" height="36"> Moda Infantil</a><button type="button" id="logout" hidden>Sair</button></header>
<main>
<h1>Painel da loja</h1>
<p id="status" role="status" aria-live="polite">Conectando ao painel…</p>
<form id="login" hidden>
  <h2>Entrar</h2>
  <label>E-mail <input name="email" type="email" autocomplete="username" required></label>
  <label>Senha <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">Entrar no painel</button>
  <button type="button" id="reset-password">Esqueci minha senha</button>
</form>
<form id="new-password" hidden>
  <h2>Crie uma nova senha</h2>
  <label>Nova senha <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="primary">Salvar nova senha</button>
</form>
<div id="dashboard" hidden>
<section>
<div class="title-row"><h2>Produtos</h2><button class="primary" id="new-product" type="button">Adicionar roupa</button></div>
<label>Categoria <select id="filter"><option value="">Todas as categorias</option></select></label>
<div id="products"></div>
</section>
<section>
<h2>Banners da página inicial</h2>
<form id="hero-form">
  <div class="hero-fields">
    <div><img id="desktop-preview" alt="Banner atual para computador"><label>Banner para computador <input name="desktop" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check"><input type="checkbox" name="resetDesktop"> Restaurar arte original</label></div>
    <div><img id="mobile-preview" alt="Banner atual para celular"><label>Banner para celular <input name="mobile" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="check"><input type="checkbox" name="resetMobile"> Restaurar arte original</label></div>
  </div>
  <p>Use JPG, PNG ou WebP de até 5 MB. Para evitar cortes, use uma arte horizontal para computador e uma vertical para celular.</p>
  <button class="primary">Salvar banners</button>
</form>
</section>
</div>
</main>
<dialog id="editor" aria-labelledby="editor-title">
<form id="product-form">
<h2 id="editor-title">Roupa</h2>
<label>Nome <input name="name" maxlength="100" required></label>
<div class="fields">
<label>Categoria <select name="category" required></select></label>
<label>Preço (R$) <input name="price" type="number" min="0" max="999999.99" step=".01" required></label>
<label>Cor <input name="color" maxlength="50" required></label>
<label>Amostra da cor <input name="colorHex" type="color" value="#a8cce0"></label>
</div>
<label>Tamanhos separados por vírgula <input name="sizes" placeholder="2, 4, 6, 8" maxlength="160" required></label>
<label>Foto da roupa <input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
<p id="product-error" role="status"></p>
<div class="title-row"><button type="button" id="cancel">Cancelar</button><button class="primary">Salvar roupa</button></div>
</form>
</dialog>
<script type="module" src="admin.js"></script>
</body>
</html>
